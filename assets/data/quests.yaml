# Tutorial Island Quest Configuration

quests:
  - id: 1
    name: "Tutorial Island"
    description: "Complete the Tutorial Island training to unlock the mainland."
    miniquest: true
    quest_points: 1
    free_to_play: true
    reward_skill_index: 3   # Hitpoints XP on completion
    tasks:

      # ── Arrival ─────────────────────────────────────────────────────────────
      - id: "speak_guide"
        type: "dialogue"
        description: "Speak to the Tutorial Guide near the dock."
        npc_id: 1
        dialogue_id: "dialogue_tutorial_intro"
        reward_xp: 10

      # ── Survival area: woodcutting / firemaking / fishing / cooking ──────────
      - id: "speak_survival_expert"
        type: "dialogue"
        description: "Speak to the Survival Expert in the grove to the west."
        npc_id: 50
        dialogue_id: "dialogue_survival_expert_intro"
        reward_xp: 10

      - id: "collect_logs"
        type: "collect"
        description: "Chop down 5 trees with your bronze axe."
        item_id: 1511
        count: 5
        reward_xp: 75

      - id: "light_fire"
        type: "action"
        description: "Light a fire using logs and your tinderbox."
        item_id: 1521
        count: 1
        reward_xp: 40

      - id: "catch_fish"
        type: "collect"
        description: "Catch 5 raw shrimps at the fishing spot."
        item_id: 317
        count: 5
        reward_xp: 50

      - id: "cook_food"
        type: "action"
        description: "Cook 3 food items at the cooking fire or range."
        npc_id: 400
        count: 3
        reward_xp: 75

      # ── Quest Guide ──────────────────────────────────────────────────────────
      - id: "speak_quest_guide"
        type: "dialogue"
        description: "Speak to the Quest Guide near the guide hut."
        npc_id: 52
        dialogue_id: "dialogue_quest_guide_intro"
        reward_xp: 10

      # ── Mining / Smithing ────────────────────────────────────────────────────
      - id: "speak_mining_instr"
        type: "dialogue"
        description: "Speak to the Mining Instructor at the mine."
        npc_id: 51
        dialogue_id: "dialogue_mining_instr_intro"
        reward_xp: 15

      - id: "mine_ore"
        type: "collect"
        description: "Mine 2 copper ore from the rocks."
        item_id: 436
        count: 2
        reward_xp: 75

      - id: "smelt_bar"
        type: "collect"
        description: "Smelt a bronze bar at the furnace."
        item_id: 2349
        count: 1
        reward_xp: 62

      - id: "smith_item"
        type: "collect"
        description: "Smith a bronze dagger at the anvil."
        item_id: 1205
        count: 1
        reward_xp: 125

      # ── Combat ───────────────────────────────────────────────────────────────
      - id: "learn_combat"
        type: "dialogue"
        description: "Speak to the Combat Instructor in the training yard."
        npc_id: 2
        dialogue_id: "dialogue_combat_instructor"
        reward_xp: 25

      - id: "equip_armor"
        type: "equip"
        description: "Equip your training armour."
        item_id: 1115
        reward_xp: 50

      - id: "kill_rats"
        type: "kill"
        description: "Defeat 3 rats in melee combat."
        npc_id: 3
        count: 3
        reward_xp: 100

      - id: "ranged_combat"
        type: "kill"
        description: "Defeat a rat using ranged combat."
        npc_id: 4
        count: 1
        reward_xp: 75

      - id: "magic_combat"
        type: "kill"
        description: "Defeat a rat using magic."
        npc_id: 5
        count: 1
        reward_xp: 75

      - id: "bury_bones"
        type: "action"
        description: "Bury 3 bones to train your Prayer skill."
        item_id: 526
        count: 3
        reward_xp: 25

      # ── Banking ──────────────────────────────────────────────────────────────
      - id: "use_bank"
        type: "action"
        description: "Open the bank to store your items."
        npc_id: 40
        count: 1
        reward_xp: 10

      # ── Completion ───────────────────────────────────────────────────────────
      - id: "return_to_guide"
        type: "hand_in"
        description: "Return to the Tutorial Guide to complete your training."
        npc_id: 1
        reward_xp: 0

    # Quest completion reward (sum of all task XP above)
    total_reward_xp: 913
    total_reward_gold: 0

    # Skill requirements (none for tutorial)
    requirements: []

    # Next quest after completion
    next_quest_id: 2

  # ── Quest 2: The Iron Coast ────────────────────────────────────────────────

  - id: 2
    name: "The Iron Coast"
    description: "Elara needs someone to push back the goblin warband threatening Ironhaven, and the mine to the east needs a brave hand."
    miniquest: false
    quest_points: 1
    free_to_play: true
    reward_skill_index: 3

    tasks:

      - id: "speak_elara"
        type: "dialogue"
        description: "Speak to Elara in Ironhaven to learn what is happening."
        npc_id: 9005
        dialogue_id: "dialogue_mainland_elara_intro"
        reward_xp: 25

      - id: "kill_goblins"
        type: "kill"
        description: "Defeat 5 goblins in the warband camp south of town."
        npc_id: 62
        count: 5
        reward_xp: 500

      - id: "mine_iron"
        type: "collect"
        description: "Mine 3 iron ore from the Iron Coast mine."
        item_id: 440
        count: 3
        reward_xp: 225

      - id: "defeat_warchief"
        type: "kill"
        description: "Defeat the Goblin Warchief at the heart of the camp."
        npc_id: 63
        count: 1
        reward_xp: 250

      - id: "return_elara"
        type: "hand_in"
        description: "Return to Elara with news of your victory."
        npc_id: 9005
        reward_xp: 1000

    total_reward_xp: 2000
    total_reward_gold: 500

    requirements:
      - quest_id: 1

    next_quest_id: null
