---
version: 1
id: "main_world"
terrain_height:
  height_step: 0.6
  regions:
    # Fishing cove inlet — lowest level (sea level)
    - name: "tutorial_coastal_low"
      min_x: 24
      min_y: 76
      max_x: 42
      max_y: 90
      level: 0
    # Arrival beach rise — slight elevation from beach to island interior
    - name: "tutorial_arrival_rise"
      min_x: 42
      min_y: 88
      max_x: 60
      max_y: 100
      level: 1
    # Hub building pad — slightly elevated town square
    - name: "tutorial_guide_square"
      min_x: 52
      min_y: 92
      max_x: 62
      max_y: 100
      level: 2
    # Artisan terrace — forge + mine area is naturally elevated rocky ground
    - name: "tutorial_resource_terrace"
      min_x: 56
      min_y: 82
      max_x: 76
      max_y: 94
      level: 1
    # Forge workshop pad — slightly higher than surrounding terrace
    - name: "tutorial_service_pad"
      min_x: 65
      min_y: 84
      max_x: 77
      max_y: 93
      level: 2
    # Grove and survival area — gentle slope
    - name: "tutorial_grove"
      min_x: 34
      min_y: 102
      max_x: 52
      max_y: 122
      level: 1
    # Combat yard area — open flat ground
    - name: "tutorial_combat_area"
      min_x: 64
      min_y: 104
      max_x: 84
      max_y: 122
      level: 1
    # Combat lane interior — slightly lower
    - name: "tutorial_combat_lane"
      min_x: 70
      min_y: 106
      max_x: 82
      max_y: 121
      level: 0
    # Mainland scaffold
    - name: "mainland_core"
      min_x: 206
      min_y: 62
      max_x: 298
      max_y: 136
      level: 1
    - name: "mainland_hub"
      min_x: 238
      min_y: 86
      max_x: 270
      max_y: 110
      level: 1

terrain_visual:
  default_type: "water"
  regions:
    # ── Tutorial Island: base layers ──────────────────────────────────────────

    # Sandy beach — island perimeter ring
    - name: "island_sand_shore"
      min_x: 20
      min_y: 62
      max_x: 92
      max_y: 130
      type: "sand"

    # Grass interior — dominant terrain; skill areas sit on natural ground.
    # Buildings and props define each zone visually — no path tiles needed per area.
    - name: "island_grass_interior"
      min_x: 25
      min_y: 67
      max_x: 87
      max_y: 125
      type: "grass"

    # Fishing cove — wide water inlet northwest; walkable shore surrounds it.
    - name: "fishing_cove_water"
      min_x: 24
      min_y: 76
      max_x: 36
      max_y: 87
      type: "water"

    # ── Travel path ───────────────────────────────────────────────────────────
    # Single arrival corridor: dock shore → central hub.
    # Skill areas branch off natural grass to keep the island feeling open.
    - name: "arrival_path"
      min_x: 34
      min_y: 85
      max_x: 60
      max_y: 97
      type: "path"

    # Central hub — guide, quest guide, banker courtyard
    - name: "central_hub_square"
      min_x: 53
      min_y: 91
      max_x: 65
      max_y: 100
      type: "path"

    # Combat training yard — enclosed arena; distinct surface from surrounding grass
    - name: "combat_yard_floor"
      min_x: 68
      min_y: 106
      max_x: 83
      max_y: 121
      type: "path"

    # ── Mainland scaffold ─────────────────────────────────────────────────────
    - name: "mainland_shore"
      min_x: 196
      min_y: 56
      max_x: 308
      max_y: 142
      type: "sand"

    - name: "mainland_grass"
      min_x: 202
      min_y: 62
      max_x: 302
      max_y: 136
      type: "grass"

    - name: "mainland_hub_path"
      min_x: 244
      min_y: 90
      max_x: 262
      max_y: 106
      type: "path"

  tile_overrides:
    # Fishing cove — sandy shore transition on east edge of water inlet
    - { x: 37, y: 84, type: "sand" }
    - { x: 37, y: 85, type: "sand" }
    - { x: 37, y: 86, type: "sand" }
    - { x: 30, y: 88, type: "sand" }
    - { x: 31, y: 88, type: "sand" }
    - { x: 32, y: 88, type: "sand" }
    # Dock landing → arrival path join
    - { x: 36, y: 88, type: "path" }
    - { x: 37, y: 88, type: "path" }
    - { x: 38, y: 89, type: "path" }

static_props:

  # ── Dock (northwest, fishing cove) ───────────────────────────────────────────
  - key: "dock_pier_small"
    x: 30
    y: 82
    rotation_y_degrees: 0.0
    scale: 2.0
    visibility_group: "base"
  - key: "dock_platform"
    x: 33
    y: 84
    rotation_y_degrees: 0.0
    scale: 2.0
    visibility_group: "base"
  - key: "dock_stairs"
