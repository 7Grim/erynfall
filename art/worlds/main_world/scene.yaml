    # Artisan terrace — forge + mine area is naturally elevated rocky ground
    - name: "tutorial_resource_terrace"
      min_x: 56
      min_y: 82
      max_x: 76
      max_y: 94
      level: 1
    # Forge workshop pad — slightly higher than surrounding terrace
    - name: "tutorial_service_pad"
      min_x: 65
      min_y: 84
      max_x: 77
      max_y: 93
      level: 2
    # Grove and survival area — gentle slope
    - name: "tutorial_grove"
      min_x: 34
      min_y: 102
      max_x: 52
      max_y: 122
      level: 1
    # Combat yard area — open flat ground
    - name: "tutorial_combat_area"
      min_x: 64
      min_y: 104
      max_x: 84
      max_y: 122
      level: 1
    # Combat lane interior — slightly lower
    - name: "tutorial_combat_lane"
      min_x: 70
      min_y: 106
      max_x: 82
      max_y: 121
      level: 0
    # Mainland scaffold
    - name: "mainland_core"
      min_x: 206
      min_y: 62
      max_x: 298
      max_y: 136
      level: 1
    - name: "mainland_hub"
      min_x: 238
      min_y: 86
      max_x: 270
      max_y: 110
      level: 1

terrain_visual:
  default_type: "water"
  regions:
    # ── Tutorial Island: base layers ──────────────────────────────────────────

    # Sandy beach — island perimeter ring
    - name: "island_sand_shore"
      min_x: 20
      min_y: 62
      max_x: 92
      max_y: 130
      type: "sand"

    # Grass interior — dominant terrain; skill areas sit on natural ground.
    # Buildings and props define each zone visually — no path tiles needed per area.
    - name: "island_grass_interior"
      min_x: 25
      min_y: 67
      max_x: 87
      max_y: 125
      type: "grass"

    # Fishing cove — wide water inlet northwest; walkable shore surrounds it.
    - name: "fishing_cove_water"
      min_x: 24
      min_y: 76
      max_x: 36
      max_y: 87
      type: "water"

    # ── Travel paths ──────────────────────────────────────────────────────────
    # Tighter path network: a short beach ramp, an arrival corridor into the
    # central hub, and three spokes branching to forge (NE), combat yard (E),
    # and grove/survival camp (S). Replaces the old 12×26 arrival plaza.

    # Beach landing — dock stairs up to the island rise (north-south strip)
    - name: "beach_landing_path"
      min_x: 36
      min_y: 86
      max_x: 42
      max_y: 95
      type: "path"

    # Arrival corridor — west-east path from beach landing into hub plaza
    - name: "arrival_corridor"
      min_x: 40
      min_y: 93
      max_x: 54
      max_y: 97
      type: "path"

    # Fishing shore apron — dirt/sand working ground around the dock + hut
    - name: "fishing_shore_apron"
      min_x: 37
      min_y: 82
      max_x: 44
      max_y: 87
      type: "sand"

    # Central hub plaza — paved square around guide/quest/banker building
    - name: "central_hub_square"
      min_x: 53
      min_y: 92
      max_x: 65
      max_y: 101
      type: "path"

    # Hub → forge (NE spur). Enters artisan terrace at forge west door (y=88).
    - name: "hub_forge_spur"
      min_x: 63
      min_y: 87
      max_x: 67
      max_y: 96
      type: "path"

    # Hub → combat yard (E dogleg, part 1: east off the hub square)
    - name: "hub_combat_spur_east"
      min_x: 63
      min_y: 97
      max_x: 71
      max_y: 101
      type: "path"

    # Hub → combat yard (E dogleg, part 2: south down to west gate at y=108)
    - name: "hub_combat_spur_south"
      min_x: 66
      min_y: 100
      max_x: 71
      max_y: 108
      type: "path"

    # Hub → grove (S spur). Drops from hub into the survival camp clearing.
    - name: "hub_grove_spur"
      min_x: 54
      min_y: 100
      max_x: 58
      max_y: 110
      type: "path"

    # Grove survival clearing — trodden dirt around Survival Expert + cook fire
    - name: "grove_cook_clearing"
      min_x: 45
      min_y: 108
      max_x: 54
      max_y: 114
      type: "path"

    # Combat training yard — enclosed arena; distinct surface from surrounding grass
    - name: "combat_yard_floor"
      min_x: 68
      min_y: 106
      max_x: 83
      max_y: 121
      type: "path"

    # ── Mainland scaffold ─────────────────────────────────────────────────────
    - name: "mainland_shore"
      min_x: 196
      min_y: 56
      max_x: 308
      max_y: 142
      type: "sand"

    - name: "mainland_grass"
      min_x: 202
      min_y: 62
      max_x: 302
      max_y: 136
      type: "grass"

    - name: "mainland_hub_path"
      min_x: 244
      min_y: 90
      max_x: 262
      max_y: 106
      type: "path"

