    visibility_group: "base"

  # ── Central hub (Tutorial Guide + Quest Guide + Banker — service indoors) ─────
  # Footprint at scale 2.5, small model (hw=2.10, hd=1.90):
  #   scaled hw=5.25, hd=4.75  →  walls: W(x=53) E(x=63) N(y=92) S(y=102)
  #   interior: x:54..62, y:93..101
  #   covers Tutorial Guide (56,95), Quest Guide (58,94), Banker (60,95) ✓
  - key: "building_shell_small_base"
    x: 58
    y: 97
    rotation_y_degrees: 0.0
    scale: 2.5
    visibility_group: "base"
  - key: "building_shell_small_roof"
    x: 58
    y: 97
    rotation_y_degrees: 0.0
    scale: 2.5
    visibility_group: "roof"

  # ── Smithing forge (anvil + furnace indoors; mining rocks remain outdoor) ─────
  # Footprint at scale 2.0, service model (hw=2.50, hd=2.10):
  #   scaled hw=5.0, hd=4.2  →  walls: W(x=66) E(x=76) N(y=84) S(y=92)
  #   interior: x:67..75, y:85..91
  #   Anvil (67,86) ✓ inside   Furnace (70,86) ✓ inside
  #   Copper Rock (63,84) OUTSIDE (west of W wall) ✓
  #   Tin Rock (66,83) OUTSIDE (north of N wall, on W wall column but y<84) ✓
  #   Mining Instructor (65,90) OUTSIDE (west of W wall) ✓
  #   West door gap at y:87..89 — players walk straight from mine into forge ✓
  - key: "building_shell_service_base"
    x: 71
    y: 88
    rotation_y_degrees: 0.0
    scale: 2.0
    visibility_group: "base"
  - key: "building_shell_service_roof"
    x: 71
    y: 88
    rotation_y_degrees: 0.0
    scale: 2.0
    visibility_group: "roof"

  # ── Combat armory (south of yard — combat training area is fully outdoor) ──────
  # Small building at scale 1.5, small model (hw=2.10, hd=1.90):
  #   scaled hw=3.15, hd=2.85  →  walls: W(x=69) E(x=75) N(y=121) S(y=126)
  #   north door at y=121 faces combat yard
  #   Melee rats (73-79, 110-113) all north of building ✓
  #   Combat Instructor (70,108) far north of building ✓
  - key: "building_shell_small_base"
    x: 72
    y: 123
    rotation_y_degrees: 0.0
    scale: 1.5
    visibility_group: "base"
  - key: "building_shell_small_roof"
    x: 72
    y: 123
    rotation_y_degrees: 0.0
    scale: 1.5
    visibility_group: "roof"

