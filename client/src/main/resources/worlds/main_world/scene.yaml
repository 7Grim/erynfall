terrain_visual:
  default_type: "water"
  regions:
    # ── Tutorial Island: base layers ──────────────────────────────────────────
    # Sandy shore — island bounding box (paints beach perimeter)
    - name: "island_sand_shore"
      min_x: 20
      min_y: 62
      max_x: 92
      max_y: 130
      type: "sand"

    # Grass interior — main walkable island surface
    - name: "island_grass_interior"
      min_x: 25
      min_y: 67
      max_x: 87
      max_y: 125
      type: "grass"

    # Fishing cove — visual water inlet (northwest).
    # Wider than walkability water in map.yaml for natural look.
    # Fishing spot NPCs at x:32/34 are on walkable shore tiles just east of here.
    - name: "fishing_cove_water"
      min_x: 24
      min_y: 76
      max_x: 36
      max_y: 87
      type: "water"

    # Grove clearing — natural grass for woodcutting area.
    # Painted before paths so path entry track can overwrite the junction.
    - name: "grove_clearing"
      min_x: 35
      min_y: 104
      max_x: 53
      max_y: 120
      type: "grass"

    # ── Paths — painted on top of base terrain ────────────────────────────────
    # Artisan yard: smithing / cooking / mining (north-east section)
    - name: "artisan_yard_path"
      min_x: 60
      min_y: 82
      max_x: 77
      max_y: 93
      type: "path"

    # Arrival path west: dock shore to mid-island
    - name: "arrival_path_west"
      min_x: 34
      min_y: 85
      max_x: 46
      max_y: 91
      type: "path"

    # Arrival path east: mid-island to central hub
    - name: "arrival_path_east"
      min_x: 44
      min_y: 89
      max_x: 57
      max_y: 96
      type: "path"

    # Central hub square: Tutorial Guide / Banker / Quest Guide
    - name: "central_hub_square"
      min_x: 53
      min_y: 91
      max_x: 65
      max_y: 100
      type: "path"

    # Mine access: hub to artisan yard
    - name: "mine_access_path"
      min_x: 57
      min_y: 88
      max_x: 68
      max_y: 93
      type: "path"

    # Grove access: hub to woodcutting grove
    - name: "grove_access_path"
      min_x: 46
      min_y: 98
      max_x: 55
      max_y: 110
      type: "path"

    # Combat access: hub to combat training yard
    - name: "combat_access_path"
      min_x: 62
      min_y: 99
      max_x: 73
      max_y: 110
      type: "path"

    # Combat training yard: fenced arena for rats + instructor
    - name: "combat_yard_floor"
      min_x: 68
      min_y: 106
      max_x: 83
      max_y: 121
      type: "path"

    # ── Mainland scaffold ─────────────────────────────────────────────────────
    - name: "mainland_shore"
      min_x: 196
      min_y: 56
      max_x: 308
      max_y: 142
      type: "sand"

    - name: "mainland_grass"
      min_x: 202
      min_y: 62
      max_x: 302
      max_y: 136
      type: "grass"

    - name: "mainland_hub_path"
      min_x: 244
      min_y: 90
      max_x: 262
      max_y: 106
      type: "path"

